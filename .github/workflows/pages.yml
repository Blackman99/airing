name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "dist/cli.js"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # on purpose: site/leaky-demo/ ships a fake .env so `airing probe` has a real target
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    # Probe what we just deployed, from the outside, like a stranger would.
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: wait for the CDN
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "https://blackman99.github.io/airing/leaky-demo/.env" && break
            sleep 10
          done
      - name: the leaky demo is caught
        shell: bash
        run: |
          set +e; node dist/cli.js probe https://blackman99.github.io/airing/leaky-demo/ --no-color > leaky.txt; code=$?; set -e
          cat leaky.txt
          test "$code" = "1"
          grep -q "LEAK  /airing/leaky-demo/.env" leaky.txt || grep -q "LEAK  .*leaky-demo/.env" leaky.txt
          grep -q "backup.sql" leaky.txt
          grep -q "app.js.map" leaky.txt
          ! grep -q "leaky-demo-fake-gemini" leaky.txt
      - name: the landing itself is clean
        run: node dist/cli.js probe https://blackman99.github.io/airing/ --no-color
      - name: share image and meta are live
        run: |
          curl -fsSI https://blackman99.github.io/airing/og.png | grep -i "content-type: image/png"
          curl -fsS https://blackman99.github.io/airing/ | grep -q 'property="og:image" content="https://blackman99.github.io/airing/og.png"'
