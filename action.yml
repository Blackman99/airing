name: "airing — deploy secret exposure check"
description: "See which .env, .git, keys and source maps your host would serve publicly before you deploy, and probe the live site."
author: "Blackman99"
branding:
  icon: "eye-off"
  color: "red"

inputs:
  path:
    description: "Project directory to scan, relative to the workspace"
    required: false
    default: "."
  host:
    description: "cf-pages, cf-workers, vercel, netlify, firebase, github-pages, gh-pages, surge or aws-s3. Empty: read it from the project's config (or check every host)"
    required: false
    default: ""
  dir:
    description: "The directory you deploy, relative to path (overrides config), e.g. dist"
    required: false
    default: ""
  probe-url:
    description: "Optional live URL to probe after deploy (GETs ~40 well-known paths; only probe sites you own)"
    required: false
    default: ""
  fail-on:
    description: "leak (default), risk, or never"
    required: false
    default: "leak"
  scan:
    description: "Set to false to only probe the URL"
    required: false
    default: "true"

outputs:
  leaks:
    description: "Number of LEAK findings (secrets or private files that would be, or are, public)"
  risks:
    description: "Number of RISK findings"
  json:
    description: "Full report as JSON (names, sizes and fingerprints only, never values)"

runs:
  using: "node24"
  main: "dist/action.js"
